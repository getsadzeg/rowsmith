[versions]
postgresql = "42.7.14"
rgxgen = "3.1"
junit = "5.14.4"
junit-oldest = "5.12.2"
junit5api = "5.14.4"
assertj = "3.27.7"
testcontainers = "2.0.5"
spring6 = "6.2.19"
spring-boot = "4.1.3"
slf4j = "2.0.17"
flyway = "12.11.0"
javapoet = "0.12.0"
errorprone = "2.53.0"
errorprone-plugin = "5.2.0"
pmd = "7.29.0"
maven-publish = "0.37.0"
plugin-publish = "2.2.1"

[libraries]
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
rgxgen = { module = "com.github.curious-odd-man:rgxgen", version.ref = "rgxgen" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-bom-oldest = { module = "org.junit:junit-bom", version.ref = "junit-oldest" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-testkit = { module = "org.junit.platform:junit-platform-testkit" }
junit5-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit5api" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
testcontainers-jdbc = { module = "org.testcontainers:testcontainers-jdbc", version.ref = "testcontainers" }
spring-jdbc = { module = "org.springframework:spring-jdbc", version.ref = "spring6" }
spring-test = { module = "org.springframework:spring-test", version.ref = "spring6" }
spring-context = { module = "org.springframework:spring-context", version.ref = "spring6" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
javapoet = { module = "com.palantir.javapoet:javapoet", version.ref = "javapoet" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }

[plugins]
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "plugin-publish" }
